<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Truck Tracking</title>
  <link rel="stylesheet" href="styles.css"> <!-- Link to CSS file -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map {
      height: 500px;
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    .container {
        width: 80%;
        margin: 0 auto;
        text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Live Truck Tracking</h1>
    <div id="map"></div>
    <div id="status">Driver is not sharing location</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script>
    const map = L.map('map').setView([37.7749, -122.4194], 14);
    const statusDiv = document.getElementById('status');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);

    let driverMarker = L.marker([37.7749, -122.4194]).addTo(map);

    const socket = io('http://localhost:3000');
    console.log("Socket connection made viewer.html");

    socket.emit('requestLocation');
    console.log('Requested initial location');

    socket.on('driverLocation', (location) => {
      console.log('Received driver location:', location);
      const newPosition = [location.lat, location.lng];
      driverMarker.setLatLng(newPosition);
      map.panTo(newPosition);
      statusDiv.textContent = 'Driver is sharing location';
    });

    socket.on('driverStopped', () => {
      console.log('Driver stopped sharing location');
      statusDiv.textContent = 'Driver is not sharing location';
    });
  </script>
</body>
</html>
