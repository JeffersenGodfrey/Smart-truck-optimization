<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck Booking - Login</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="truck.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Login to Truck Booking</h1>
        
        <h2>Login as:</h2>
        <button id="googleLoginUser" class="btn btn-user">Login as User</button>
        <button id="googleLoginDriver" class="btn btn-driver">Login as Driver</button>
        
        <p>Don't have an account? <a href="#" id="signupLink">Sign up here</a>.</p>
    </div>

    <script>
        document.getElementById("signupLink").addEventListener("click", function() {
            alert("To sign up, choose your role and log in with Google. Your account will be created automatically.");
        });
    </script>
</body>
</html>
