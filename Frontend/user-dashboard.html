<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Truck Journeys - Cargo Cruise</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.283.1.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .btn {
            background-color: #007bff;
            border: none;
            color: white;
            padding: 10px 16px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .journey-item {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            background-color: #fafafa;
        }
        .truck-img {
            max-width: 100%;
            height: auto;
            margin-top: 10px;
            border-radius: 5px;
        }
        .btn-book, .btn-contact {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Search for Truck Journeys</h1>
        <form id="searchForm">
            <div class="form-group">
                <label for="fromCity">From City:</label>
                <input type="text" id="fromCity" name="fromCity" required>
            </div>
            <div class="form-group">
                <label for="toCity">To City:</label>
                <input type="text" id="toCity" name="toCity" required>
            </div>
            <button type="submit" class="btn btn-search">Search</button>
        </form>

        <h2>Available Truck Journeys</h2>
        <div id="journeyResults">
            <!-- Journey results will be inserted here -->
        </div>
    </div>

    <!-- Include the retrieve logic -->
    <script src="retrive.js"></script>
</body>
</html>
